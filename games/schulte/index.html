<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>html{background:linear-gradient(135deg,#5865d9,#9a5bc6) fixed}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舒尔特方格盘 - Fun City</title>
    <link rel="stylesheet" href="../../assets/theme.css?v=21">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body data-game="schulte">
    <div class="container">
        <header class="header">
            <div>
                <h1>舒尔特方格盘</h1>
            </div>
            <button class="return-lobby-btn ghost-btn">返回大厅</button>
        </header>

        <div id="main-menu" class="screen">
            <h2>请选择游戏模式</h2>
            <div class="difficulty-grid">
                <button id="classic-mode-btn" class="difficulty-btn">
                    <span class="difficulty-name">经典模式</span>
                    <span class="difficulty-detail">固定 5×5</span>
                </button>
                <button id="standard-mode-btn" class="difficulty-btn">
                    <span class="difficulty-name">标准模式</span>
                    <span class="difficulty-detail">3×3 ~ 9×9</span>
                </button>
                <button id="poetry-mode-btn" class="difficulty-btn">
                    <span class="difficulty-name">唐诗300首</span>
                    <span class="difficulty-detail">简体带拼音，按顺序点字</span>
                </button>
            </div>
        </div>

        <div id="standard-mode-screen" class="screen" style="display: none;">
            <h2>标准模式</h2>
            <p class="mode-description">选择难度直接开始游戏</p>
            <div class="difficulty-grid">
                <button class="difficulty-btn start-directly" data-size="3">
                    <span class="difficulty-name">3×3</span>
                    <span class="difficulty-detail">9 格</span>
                </button>
                <button class="difficulty-btn start-directly" data-size="4">
                    <span class="difficulty-name">4×4</span>
                    <span class="difficulty-detail">16 格</span>
                </button>
                <button class="difficulty-btn start-directly" data-size="5">
                    <span class="difficulty-name">5×5</span>
                    <span class="difficulty-detail">25 格</span>
                </button>
                <button class="difficulty-btn start-directly" data-size="6">
                    <span class="difficulty-name">6×6</span>
                    <span class="difficulty-detail">36 格</span>
                </button>
                <button class="difficulty-btn start-directly" data-size="7">
                    <span class="difficulty-name">7×7</span>
                    <span class="difficulty-detail">49 格</span>
                </button>
                <button class="difficulty-btn start-directly" data-size="8">
                    <span class="difficulty-name">8×8</span>
                    <span class="difficulty-detail">64 格</span>
                </button>
                <button class="difficulty-btn start-directly" data-size="9">
                    <span class="difficulty-name">9×9</span>
                    <span class="difficulty-detail">81 格</span>
                </button>
            </div>
            <div class="bottom-buttons">
                <button class="back-btn btn">返回</button>
            </div>
        </div>

        <div id="poetry-mode-screen" class="screen" style="display: none;">
            <h2>唐诗300首</h2>
            <p id="poetry-mode-description" class="mode-description">正在加载唐诗诗库...</p>
            <div class="poetry-list" id="poetry-list"></div>
            <div class="bottom-buttons">
                <button class="back-btn btn">返回</button>
            </div>
        </div>

        <div id="game-screen" class="screen" style="display: none;">
            <div class="info-panel">
                <div class="info-item">
                    <span class="label">目标</span>
                    <span id="target-number" class="value">1</span>
                </div>
                <div class="info-item">
                    <span class="label">用时</span>
                    <span id="timer" class="value">0.00</span>
                </div>
                <div class="info-item">
                    <span class="label">最佳</span>
                    <span id="best-time" class="value">--</span>
                </div>
            </div>
            <div class="poetry-display" id="poetry-display" style="display: none;">
                <h3 id="poetry-title"></h3>
                <p id="poetry-content"></p>
            </div>
            <div class="board-wrap">
                <div class="game-board" id="game-board" aria-label="舒尔特方格棋盘"></div>
                <div id="start-overlay" class="start-overlay">
                    <button class="start-btn" type="button">开始游戏</button>
                </div>
            </div>
            <div class="controls">
                <button id="restart-btn" class="btn">重新开始</button>
                <button class="back-btn btn">返回</button>
            </div>
        </div>

        <div id="result-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>恭喜！你完成了游戏！</h2>
                <p id="result-info"></p>
                <p id="result-time"></p>
                <div id="result-comparison" class="result-comparison" style="display: none;">
                    <p id="last-result"></p>
                </div>
                <div class="modal-buttons">
                    <button id="modal-next-btn" class="btn next-btn">下一关</button>
                    <button id="modal-restart-btn" class="btn">再来一局</button>
                    <button id="modal-back-btn" class="return-lobby-btn btn">返回大厅</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../../assets/util.js?v=3"></script>
    <script src="../../assets/player.js?v=3"></script>
    <script src="../../assets/audio.js?v=4"></script>
    <script src="../../assets/features.js?v=12"></script>
    <script src="../../assets/theme-switcher.js?v=3"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
