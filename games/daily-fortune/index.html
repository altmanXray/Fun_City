<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日一签 - Fun City</title>
    <link rel="icon" type="image/svg+xml" href="../../assets/logo.svg">
    <link rel="stylesheet" href="../../assets/theme.css?v=21">
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body data-game="daily-fortune">
    <div class="container">
        <header class="header">
            <div><h1>每日一签</h1><p>每天一支签，同一天同结果</p></div>
            <button class="return-lobby-btn ghost-btn">返回大厅</button>
        </header>
        <main>
            <div id="draw-screen" class="draw-screen">
                <div class="bucket-wrap" id="bucket-wrap">
                    <svg viewBox="0 0 120 150" class="bucket">
                        <rect x="30" y="60" width="60" height="80" rx="8" fill="#8b4513" stroke="#5d2f0d" stroke-width="3"/>
                        <rect x="35" y="55" width="50" height="10" rx="5" fill="#a0522d"/>
                        <rect x="42" y="20" width="6" height="40" fill="#deb887" rx="2" transform="rotate(-8 45 40)"/>
                        <rect x="55" y="18" width="6" height="42" fill="#deb887" rx="2"/>
                        <rect x="68" y="22" width="6" height="38" fill="#deb887" rx="2" transform="rotate(8 71 41)"/>
                        <text x="60" y="105" text-anchor="middle" fill="#deb887" font-size="12" font-weight="bold">签</text>
                    </svg>
                </div>
                <p class="draw-hint" id="draw-hint">点击签筒摇一签</p>
                <button id="draw-btn" class="btn">🏮 摇签</button>
            </div>
            <div id="result-screen" class="result-screen" style="display:none;">
                <div class="fortune-card" id="fortune-card">
                    <div class="fortune-level" id="fortune-level"></div>
                    <div class="fortune-num" id="fortune-num"></div>
                    <div class="fortune-verse" id="fortune-verse"></div>
                    <div class="fortune-sections" id="fortune-sections"></div>
                </div>
                <button id="history-btn" class="btn secondary-btn">历史记录</button>
            </div>
            <div id="history-screen" class="history-screen" style="display:none;">
                <h2>历史记录</h2>
                <div id="history-list"></div>
                <button id="back-draw" class="btn secondary-btn">返回摇签</button>
            </div>
        </main>
    </div>
    <script src="../../assets/util.js?v=3"></script>
    <script src="../../assets/player.js?v=3"></script>
    <script src="../../assets/audio.js?v=5"></script>
    <script src="../../assets/features.js?v=12"></script>
    <script src="../../assets/theme-switcher.js?v=3"></script>
    <script src="script.js?v=1"></script>
</body>
</html>
