<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>html{background:linear-gradient(135deg,#5865d9,#9a5bc6) fixed}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - Fun City</title>
    <link rel="stylesheet" href="../../assets/theme.css?v=21">
    <link rel="stylesheet" href="style.css?v=17">
</head>
<body data-game="gomoku">
    <div class="container">
        <header class="header">
            <div>
                <h1>五子棋</h1>
                <p>先连成五子者获胜。</p>
            </div>
            <button class="return-lobby-btn ghost-btn">返回大厅</button>
        </header>

        <main>
            <section class="top-row" aria-label="对战模式与状态">
                <div class="mode-switch">
                    <div class="mode-btn-wrap" id="pve-wrap">
                        <button class="mode-btn active" data-mode="pve" type="button">人机对战</button>
                        <button class="level-caret" id="level-caret" type="button" title="选择机器人强度" aria-haspopup="true"><span class="level-name">标准</span> ▾</button>
                        <div class="level-menu" id="level-menu" role="menu" style="display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:118px;padding:6px;border-radius:12px;background:#fbf7ef;box-shadow:0 10px 28px rgba(40,25,90,0.22);">
                            <button class="level-opt" data-level="caiji" type="button" role="menuitem">菜鸡</button>
                            <button class="level-opt active" data-level="std" type="button" role="menuitem">标准</button>
                            <button class="level-opt" data-level="expert" type="button" role="menuitem">专家</button>
                            <button class="level-opt" data-level="master" type="button" role="menuitem">大师</button>
                            <button class="level-opt" data-level="chovy" type="button" role="menuitem">我Chovy</button>
                            <button class="level-opt" data-level="god" type="button" role="menuitem">超级大神</button>
                        </div>
                    </div>
                    <button class="mode-btn" data-mode="pvp" type="button">双人对战</button>
                </div>
                <div class="status-chip">
                    <span id="turn-dot" class="turn-dot black"></span>
                    <span id="status-text" class="status-text">轮到黑棋落子</span>
                </div>
            </section>

            <section class="board-wrap">
                <canvas id="board" class="board" aria-label="五子棋棋盘"></canvas>
                <div id="start-overlay" class="start-overlay">
                    <button class="start-btn" type="button">开始游戏</button>
                </div>
                <div id="message-panel" class="message-panel" style="display: none;">
                    <h2 id="message-title">游戏结束</h2>
                    <p id="message-text"></p>
                    <div class="message-actions">
                        <button id="message-restart-btn" class="btn">再来一局</button>
                    </div>
                </div>
            </section>

            <section class="bottom-row" aria-label="用时记录与操作">
                <div class="info-item">
                    <span class="label">用时</span>
                    <span id="time" class="value">0.00</span>
                </div>
                <div class="info-item">
                    <span class="label">最快获胜</span>
                    <span id="best-time" class="value">--</span>
                </div>
                <div class="controls">
                    <button id="restart-btn" class="btn">重新开始</button>
                    <button id="undo-btn" class="btn secondary-btn">悔棋</button>
                </div>
            </section>
        </main>
    </div>

    <script src="../../assets/util.js?v=3"></script>
    <script src="../../assets/player.js?v=3"></script>
    <script src="../../assets/audio.js?v=4"></script>
    <script src="../../assets/features.js?v=12"></script>
    <script src="../../assets/theme-switcher.js?v=3"></script>
    <script src="script.js?v=16"></script>
</body>
</html>
