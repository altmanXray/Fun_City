<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五子棋 - LittleGame</title>
    <link rel="stylesheet" href="../../assets/theme.css?v=4">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body data-game="gomoku">
    <div class="container">
        <header class="header">
            <div>
                <h1>五子棋</h1>
                <p>先连成五子者获胜。</p>
            </div>
            <button class="return-lobby-btn ghost-btn">返回大厅</button>
        </header>

        <main>
            <section class="top-row" aria-label="对战模式与状态">
                <div class="mode-switch">
                    <button class="mode-btn active" data-mode="pve" type="button">人机对战</button>
                    <button class="mode-btn" data-mode="pvp" type="button">双人对战</button>
                </div>
                <div class="status-chip">
                    <span id="turn-dot" class="turn-dot black"></span>
                    <span id="status-text" class="status-text">轮到黑棋落子</span>
                </div>
            </section>

            <section class="board-wrap">
                <canvas id="board" class="board" aria-label="五子棋棋盘"></canvas>
                <div id="start-overlay" class="start-overlay">
                    <button class="start-btn" type="button">开始游戏</button>
                </div>
                <div id="message-panel" class="message-panel" style="display: none;">
                    <h2 id="message-title">游戏结束</h2>
                    <p id="message-text"></p>
                    <div class="message-actions">
                        <button id="message-restart-btn" class="btn">再来一局</button>
                    </div>
                </div>
            </section>

            <section class="bottom-row" aria-label="用时记录与操作">
                <div class="info-item">
                    <span class="label">用时</span>
                    <span id="time" class="value">0.00</span>
                </div>
                <div class="info-item">
                    <span class="label">最快获胜</span>
                    <span id="best-time" class="value">--</span>
                </div>
                <div class="controls">
                    <button id="restart-btn" class="btn">重新开始</button>
                    <button id="undo-btn" class="btn secondary-btn">悔棋</button>
                </div>
            </section>
        </main>
    </div>

    <script src="../../assets/util.js?v=3"></script>
    <script src="../../assets/player.js?v=3"></script>
    <script src="../../assets/audio.js?v=3"></script>
    <script src="../../assets/features.js?v=5"></script>
    <script src="script.js?v=6"></script>
</body>
</html>
