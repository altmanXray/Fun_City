<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>html{background:linear-gradient(135deg,#5865d9,#9a5bc6) fixed}</style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紫微斗数 - Fun City</title>
    <link rel="stylesheet" href="../../assets/theme.css?v=21">
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body data-game="ziwei">
    <div class="container">
        <header class="header">
            <div>
                <h1>紫微斗数</h1>
            </div>
            <button class="return-lobby-btn ghost-btn">返回大厅</button>
        </header>

        <main>
            <!-- 输入页 -->
            <section id="input-screen" class="screen">
                <h2>排出你的命盘</h2>
                <p class="mode-description">十二宫 · 十四主星 · 四化 · 大限</p>
                <div class="form-grid">
                    <div class="form-item">
                        <label class="form-label" for="birth-date">出生日期（公历）</label>
                        <input type="date" id="birth-date" min="1900-01-01" max="2100-12-31" value="2000-01-01">
                    </div>
                    <div class="form-item">
                        <label class="form-label" for="birth-hour">出生时辰</label>
                        <select id="birth-hour"></select>
                    </div>
                    <div class="form-item">
                        <span class="form-label">性别</span>
                        <div class="pill-group">
                            <label class="pill"><input type="radio" name="gender" value="male" checked><span>♂ 男</span></label>
                            <label class="pill"><input type="radio" name="gender" value="female"><span>♀ 女</span></label>
                        </div>
                    </div>
                </div>
                <div class="input-actions">
                    <button id="calc-btn" class="btn">🌌 开始排盘</button>
                    <button id="history-btn" class="btn secondary-btn">历史记录</button>
                </div>
                <p class="ziwei-note">三合派规则排盘；闰月按「上半月算本月、下半月算下月」；内容仅供娱乐与文化参考。</p>
            </section>

            <!-- 结果页 -->
            <section id="result-screen" class="screen" style="display:none;">
                <div id="zw-summary" class="zw-summary"></div>
                <div id="chart-block"></div>
                <div id="soul-reading"></div>
                <div id="palace-readings"></div>
                <p class="ziwei-note">命盘如星空，星曜说的是倾向不是判决——你才是执盘人 ✨。</p>
                <div class="result-actions">
                    <button id="again-btn" class="btn">再测一次</button>
                    <button id="history-btn2" class="btn secondary-btn">历史记录</button>
                </div>
            </section>

            <!-- 历史页 -->
            <section id="history-screen" class="screen" style="display:none;">
                <h2>排盘历史</h2>
                <p class="mode-description">按时间倒序，最多保留最近 50 条</p>
                <div id="history-list" class="history-list"></div>
                <div class="result-actions">
                    <button id="clear-history-btn" class="btn secondary-btn">清空记录</button>
                    <button id="back-btn" class="btn">返回</button>
                </div>
            </section>
        </main>
    </div>

    <script src="../../assets/util.js?v=3"></script>
    <script src="../../assets/player.js?v=3"></script>
    <script src="../../assets/audio.js?v=4"></script>
    <script src="../../assets/features.js?v=12"></script>
    <script src="../../assets/calendar-core.js?v=2"></script>
    <script src="script.js?v=1"></script>
</body>
</html>
