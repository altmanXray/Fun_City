<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记忆翻牌 - LittleGame</title>
    <link rel="stylesheet" href="../../assets/theme.css?v=4">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body data-game="memory">
    <div class="container menu-mode">
        <header class="header">
            <h1>记忆翻牌</h1>
            <button class="return-lobby-btn ghost-btn">返回大厅</button>
        </header>

        <main>
            <section id="menu-screen" class="screen">
                <h2>选择难度</h2>
                <div class="difficulty-grid">
                    <button class="difficulty-btn" data-level="easy">
                        <span class="difficulty-name">简单</span>
                        <span class="difficulty-detail">4×3 · 6 组</span>
                    </button>
                    <button class="difficulty-btn" data-level="medium">
                        <span class="difficulty-name">中等</span>
                        <span class="difficulty-detail">4×4 · 8 组</span>
                    </button>
                    <button class="difficulty-btn" data-level="hard">
                        <span class="difficulty-name">困难</span>
                        <span class="difficulty-detail">6×4 · 12 组</span>
                    </button>
                </div>
                <div class="best-panel">
                    <p>最佳记录：<span id="best-record">--</span></p>
                </div>
            </section>

            <section id="game-screen" class="screen" style="display: none;">
                <div class="info-panel">
                    <div class="info-item">
                        <span class="label">用时</span>
                        <span id="timer" class="value">0.00</span>
                    </div>
                    <div class="info-item">
                        <span class="label">步数</span>
                        <span id="moves" class="value">0</span>
                    </div>
                    <div class="info-item">
                        <span class="label">配对</span>
                        <span id="pairs" class="value">0/6</span>
                    </div>
                    <div class="info-item">
                        <span class="label">最佳</span>
                        <span id="best-time" class="value">--</span>
                    </div>
                </div>

                <div class="board-wrap">
                    <div id="memory-board" class="memory-board" aria-label="记忆翻牌游戏面板"></div>
                    <div id="start-overlay" class="start-overlay">
                        <button class="start-btn" type="button">开始游戏</button>
                    </div>
                </div>

                <div class="game-controls">
                    <button id="restart-btn" class="control-btn">重新开始</button>
                    <button id="change-level-btn" class="control-btn secondary-control">换个难度</button>
                </div>
            </section>
        </main>

        <div id="result-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>全部配对完成</h2>
                <p id="result-summary"></p>
                <p id="record-summary"></p>
                <div class="modal-buttons">
                    <button id="play-again-btn" class="btn">再来一局</button>
                    <button id="modal-menu-btn" class="btn secondary-btn">选择难度</button>
                    <button class="return-lobby-btn btn secondary-btn">返回大厅</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/util.js?v=3"></script>
    <script src="../../assets/player.js?v=3"></script>
    <script src="../../assets/audio.js?v=3"></script>
    <script src="../../assets/features.js?v=5"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
