<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数独 - LittleGame</title>
    <link rel="stylesheet" href="../../assets/theme.css?v=4">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body data-game="sudoku">
    <div class="container">
        <header class="header">
            <h1>数独</h1>
            <button class="return-lobby-btn ghost-btn">返回大厅</button>
        </header>
        
        <div id="difficulty-screen" class="screen">
            <h2>选择难度</h2>
            <div class="difficulty-grid">
                <button class="difficulty-btn" data-level="easy">
                    <span class="difficulty-name">简单</span>
                    <span class="difficulty-detail">40 个提示</span>
                </button>
                <button class="difficulty-btn" data-level="medium">
                    <span class="difficulty-name">中等</span>
                    <span class="difficulty-detail">30 个提示</span>
                </button>
                <button class="difficulty-btn" data-level="hard">
                    <span class="difficulty-name">困难</span>
                    <span class="difficulty-detail">25 个提示</span>
                </button>
                <button class="difficulty-btn" data-level="expert">
                    <span class="difficulty-name">专家</span>
                    <span class="difficulty-detail">20 个提示</span>
                </button>
            </div>
            <div class="best-panel">
                <p>最佳记录：<span id="best-record">--</span></p>
            </div>
        </div>
        
        <div id="game-screen" class="screen" style="display: none;">
            <div class="info-panel">
                <div class="info-item">
                    <span class="label">难度</span>
                    <span id="difficulty-display" class="value">简单</span>
                </div>
                <div class="info-item">
                    <span class="label">用时</span>
                    <span id="timer" class="value">0.00</span>
                </div>
                <div class="info-item">
                    <span class="label">错误</span>
                    <span id="mistakes" class="value">0/3</span>
                </div>
                <div class="info-item">
                    <span class="label">最佳</span>
                    <span id="best-time" class="value">--</span>
                </div>
            </div>
            
            <div class="board-wrap">
                <div class="sudoku-board" id="sudoku-board" aria-label="数独棋盘"></div>
                <div id="start-overlay" class="start-overlay">
                    <button class="start-btn" type="button">开始游戏</button>
                </div>
            </div>
            
            <div class="number-pad" id="number-pad">
                <button class="num-btn" data-num="1"><span class="num-value">1</span><span class="num-remaining">剩余 9</span></button>
                <button class="num-btn" data-num="2"><span class="num-value">2</span><span class="num-remaining">剩余 9</span></button>
                <button class="num-btn" data-num="3"><span class="num-value">3</span><span class="num-remaining">剩余 9</span></button>
                <button class="num-btn" data-num="4"><span class="num-value">4</span><span class="num-remaining">剩余 9</span></button>
                <button class="num-btn" data-num="5"><span class="num-value">5</span><span class="num-remaining">剩余 9</span></button>
                <button class="num-btn" data-num="6"><span class="num-value">6</span><span class="num-remaining">剩余 9</span></button>
                <button class="num-btn" data-num="7"><span class="num-value">7</span><span class="num-remaining">剩余 9</span></button>
                <button class="num-btn" data-num="8"><span class="num-value">8</span><span class="num-remaining">剩余 9</span></button>
                <button class="num-btn" data-num="9"><span class="num-value">9</span><span class="num-remaining">剩余 9</span></button>
            </div>
            
            <div class="game-controls">
                <button id="rules-btn" class="control-btn secondary-btn">规则</button>
                <button id="hint-btn" class="control-btn">提示(3)</button>
                <button id="restart-btn" class="control-btn">重新开始</button>
                <button class="back-btn control-btn">返回</button>
            </div>
        </div>

        <div id="rules-modal" class="modal" style="display: none;">
            <div class="modal-content rules-modal-content">
                <h2>数独规则</h2>
                <p>目标是把空白格填满，让每一行、每一列、每个 3×3 宫格都恰好包含 1 到 9，且不能重复。</p>
                <p>先点击一个空白格，再点击下方数字按钮填写答案。灰色数字是题目给定的，不能修改。</p>
                <p>填错会累计错误次数，达到 3 次游戏结束。卡住时可以使用提示，它会帮你填入当前选中格的正确数字。</p>
                <div class="modal-buttons">
                    <button id="close-rules-btn" class="btn">我知道了</button>
                </div>
            </div>
        </div>
        
        <div id="result-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2 id="result-title">恭喜完成！</h2>
                <p id="result-info"></p>
                <p id="result-time"></p>
                <div id="result-comparison" class="result-comparison" style="display: none;">
                    <p id="last-result"></p>
                </div>
                <div class="modal-buttons">
                    <button id="play-again-btn" class="btn">再来一局</button>
                    <button id="change-difficulty-btn" class="btn">换个难度</button>
                    <button class="return-lobby-btn btn">返回大厅</button>
                </div>
            </div>
        </div>
        
        <div id="game-over-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <h2>游戏结束</h2>
                <p>错误次数过多，游戏失败！</p>
                <div class="modal-buttons">
                    <button id="try-again-btn" class="btn">再试一次</button>
                    <button class="return-lobby-btn btn">返回大厅</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../../assets/util.js?v=3"></script>
    <script src="../../assets/player.js?v=3"></script>
    <script src="../../assets/audio.js?v=3"></script>
    <script src="../../assets/features.js?v=5"></script>
    <script src="script.js?v=3"></script>
</body>
</html>
