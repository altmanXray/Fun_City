<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LittleGame - 游戏大厅</title>
    <link rel="stylesheet" href="assets/theme.css?v=4">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body data-lobby>
    <div class="lobby-container">
        <header class="header">
            <h1 class="logo">LittleGame</h1>
            <p class="subtitle">精选休闲游戏合集</p>
        </header>
        
        <main class="game-grid">
            <div class="game-card" data-game="schulte">
                <div class="game-icon">
                    <span class="icon-text">🎯</span>
                </div>
                <h3 class="game-title">舒尔特方格</h3>
                <p class="game-description">提升专注力与反应速度</p>
                <div class="game-tags">
                    <span class="tag">益智</span>
                    <span class="tag">训练</span>
                </div>
                <button class="play-btn">开始游戏</button>
            </div>
            
            <div class="game-card" data-game="sudoku">
                <div class="game-icon">
                    <span class="icon-text">🔢</span>
                </div>
                <h3 class="game-title">数独</h3>
                <p class="game-description">经典数字逻辑填空游戏</p>
                <div class="game-tags">
                    <span class="tag">逻辑</span>
                    <span class="tag">休闲</span>
                </div>
                <button class="play-btn">开始游戏</button>
            </div>

            <div class="game-card" data-game="memory">
                <div class="game-icon">
                    <span class="icon-text">🧠</span>
                </div>
                <h3 class="game-title">记忆翻牌</h3>
                <p class="game-description">翻开卡片，找出所有成对图案</p>
                <div class="game-tags">
                    <span class="tag">记忆</span>
                    <span class="tag">配对</span>
                </div>
                <button class="play-btn">开始游戏</button>
            </div>

            <div class="game-card" data-game="2048">
                <div class="game-icon">
                    <span class="icon-text">🧮</span>
                </div>
                <h3 class="game-title">2048</h3>
                <p class="game-description">滑动数字方块，合并冲击高分</p>
                <div class="game-tags">
                    <span class="tag">策略</span>
                    <span class="tag">数字</span>
                </div>
                <button class="play-btn">开始游戏</button>
            </div>

            <div class="game-card" data-game="gomoku">
                <div class="game-icon">
                    <span class="icon-text">⚫</span>
                </div>
                <h3 class="game-title">五子棋</h3>
                <p class="game-description">连成五子取胜，支持人机与双人</p>
                <div class="game-tags">
                    <span class="tag">对弈</span>
                    <span class="tag">策略</span>
                </div>
                <button class="play-btn">开始游戏</button>
            </div>

            <div class="game-card coming-soon">
                <div class="game-icon">
                    <span class="icon-text">🎮</span>
                </div>
                <h3 class="game-title">更多游戏</h3>
                <p class="game-description">敬请期待...</p>
                <div class="game-tags">
                    <span class="tag">开发中</span>
                </div>
                <button class="play-btn disabled">即将上线</button>
            </div>
        </main>
        
        <footer class="footer">
            <p>© 2024 LittleGame</p>
        </footer>
    </div>
    
    <script src="assets/util.js?v=3"></script>
    <script src="assets/player.js?v=3"></script>
    <script src="assets/audio.js?v=3"></script>
    <script src="assets/features.js?v=5"></script>
    <script src="script.js"></script>
</body>
</html>
